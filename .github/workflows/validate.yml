name: Validate release materials

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ShellCheck
        run: git ls-files '*.sh' 'scripts/*' 'addons/bbr/bbrctl' | xargs shellcheck --severity=error
      - name: Validate scripts and version documentation
        run: bash scripts/release-check.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release from the verified version notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME · 稳定版本" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --latest
